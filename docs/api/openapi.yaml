openapi: 3.0.3
info:
  title: FinOps SaaS Platform API
  description: |
    REST API for the FinOps SaaS platform providing cost management, 
    optimization, and governance capabilities across multi-cloud environments.
  version: 1.0.0
  contact:
    name: API Support
    email: api-support@finops.example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.finops.example.com/v1
    description: Production
  - url: https://staging-api.finops.example.com/v1
    description: Staging
  - url: http://localhost:3000/v1
    description: Local Development

tags:
  - name: Authentication
    description: Authentication and authorization endpoints
  - name: Tenants
    description: Tenant and organization management
  - name: Costs
    description: Cost data queries and analysis
  - name: Budgets
    description: Budget management and monitoring
  - name: Recommendations
    description: Cost optimization recommendations
  - name: Workflows
    description: Workflow and automation management
  - name: Reports
    description: Report generation and scheduling
  - name: Integrations
    description: External service integrations

paths:
  /auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate user with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  refresh_token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'

  /costs:
    get:
      tags:
        - Costs
      summary: Query cost data
      description: Retrieve cost data with filtering and aggregation
      security:
        - bearerAuth: []
      parameters:
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: provider
          in: query
          schema:
            type: string
            enum: [aws, azure, gcp, oracle, akamai, datacenter]
        - name: group_by
          in: query
          schema:
            type: array
            items:
              type: string
              enum: [service, account, region, tag]
        - name: granularity
          in: query
          schema:
            type: string
            enum: [daily, weekly, monthly]
            default: daily
      responses:
        '200':
          description: Cost data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CostRecord'
                  summary:
                    $ref: '#/components/schemas/CostSummary'

  /budgets:
    get:
      tags:
        - Budgets
      summary: List budgets
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of budgets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Budget'
    post:
      tags:
        - Budgets
      summary: Create budget
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetCreate'
      responses:
        '201':
          description: Budget created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'

  /recommendations:
    get:
      tags:
        - Recommendations
      summary: List recommendations
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, accepted, dismissed, implemented]
        - name: category
          in: query
          schema:
            type: string
            enum: [rightsizing, ri_sp, idle_resources, storage]
      responses:
        '200':
          description: List of recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Recommendation'

  /workflows:
    get:
      tags:
        - Workflows
      summary: List workflows
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of workflows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workflow'
    post:
      tags:
        - Workflows
      summary: Create workflow
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowCreate'
      responses:
        '201':
          description: Workflow created

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        tenant_id:
          type: string
        role:
          type: string

    CostRecord:
      type: object
      properties:
        tenant_id:
          type: string
        provider:
          type: string
          enum: [aws, azure, gcp, oracle, akamai, datacenter]
        account_id:
          type: string
        service:
          type: string
        region:
          type: string
        usage_date:
          type: string
          format: date
        cost:
          type: number
          format: double
        currency:
          type: string

    CostSummary:
      type: object
      properties:
        total_cost:
          type: number
          format: double
        currency:
          type: string
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date

    Budget:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        name:
          type: string
        amount:
          type: number
          format: double
        period:
          type: string
          enum: [monthly, quarterly, yearly]
        threshold_percentage:
          type: number
        current_spend:
          type: number
          format: double
        forecast_spend:
          type: number
          format: double

    BudgetCreate:
      type: object
      required:
        - name
        - amount
        - period
      properties:
        name:
          type: string
        amount:
          type: number
          format: double
        period:
          type: string
          enum: [monthly, quarterly, yearly]
        threshold_percentage:
          type: number
          default: 80

    Recommendation:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        category:
          type: string
        title:
          type: string
        description:
          type: string
        estimated_monthly_savings:
          type: number
          format: double
        status:
          type: string
          enum: [open, accepted, dismissed, implemented]
        created_at:
          type: string
          format: date-time

    Workflow:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        trigger:
          type: object
        actions:
          type: array
          items:
            type: object

    WorkflowCreate:
      type: object
      required:
        - name
        - trigger
        - actions
      properties:
        name:
          type: string
        trigger:
          type: object
        actions:
          type: array
          items:
            type: object

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: string
