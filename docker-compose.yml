version: '3.8'

services:
  # Infrastructure
  postgres:
    image: postgres:16-alpine
    container_name: fintek-postgres
    environment:
      POSTGRES_USER: fintek
      POSTGRES_PASSWORD: fintek_dev
      POSTGRES_DB: fintek
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintek"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fintek-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: bitnami/kafka:3.6
    container_name: fintek-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 5

  trino:
    image: trinodb/trino:435
    container_name: fintek-trino
    ports:
      - "8080:8080"
    volumes:
      - ./infra/trino/catalog:/etc/trino/catalog
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/v1/info || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: fintek-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: fintek
      MINIO_ROOT_PASSWORD: fintek_dev
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Services
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: fintek-gateway
    ports:
      - "8000:8000"
    environment:
      - AUTH_SERVICE_URL=http://auth:8001
      - TENANT_SERVICE_URL=http://tenant:8002
      - INGESTION_SERVICE_URL=http://ingestion:8003
      - WORKFLOWS_SERVICE_URL=http://workflows:8004
      - BUDGETS_SERVICE_URL=http://budgets:8005
      - QUERY_SERVICE_URL=http://query:8006
      - INTEGRATIONS_SERVICE_URL=http://integrations:8007
    depends_on:
      - auth
      - tenant
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  auth:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: fintek-auth
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://fintek:fintek_dev@postgres:5432/fintek
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  tenant:
    build:
      context: ./services/tenant
      dockerfile: Dockerfile
    container_name: fintek-tenant
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql+asyncpg://fintek:fintek_dev@postgres:5432/fintek
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  ingestion:
    build:
      context: ./services/ingestion
      dockerfile: Dockerfile
    container_name: fintek-ingestion
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql+asyncpg://fintek:fintek_dev@postgres:5432/fintek
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  workflows:
    build:
      context: ./services/workflows
      dockerfile: Dockerfile
    container_name: fintek-workflows
    ports:
      - "8004:8004"
    environment:
      - DATABASE_URL=postgresql+asyncpg://fintek:fintek_dev@postgres:5432/fintek
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  budgets:
    build:
      context: ./services/budgets
      dockerfile: Dockerfile
    container_name: fintek-budgets
    ports:
      - "8005:8005"
    environment:
      - DATABASE_URL=postgresql+asyncpg://fintek:fintek_dev@postgres:5432/fintek
      - REDIS_URL=redis://redis:6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  query:
    build:
      context: ./services/query
      dockerfile: Dockerfile
    container_name: fintek-query
    ports:
      - "8006:8006"
    environment:
      - TRINO_HOST=trino
      - TRINO_PORT=8080
      - REDIS_URL=redis://redis:6379
    depends_on:
      trino:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  integrations:
    build:
      context: ./services/integrations
      dockerfile: Dockerfile
    container_name: fintek-integrations
    ports:
      - "8007:8007"
    environment:
      - DATABASE_URL=postgresql+asyncpg://fintek:fintek_dev@postgres:5432/fintek
      - REDIS_URL=redis://redis:6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=fintek
      - MINIO_SECRET_KEY=fintek_dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  minio_data:
